<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Charliejobs">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Charliejobs</title>
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --label:#1c1c1e; --label2:#6c6c70; --fill:rgba(120,120,128,.12);
  --sep:rgba(60,60,67,.14); --blue:#007aff; --green:#34c759; --green-text:#248a3d; --orange:#ff9500;
  --red:#ff3b30; --purple:#af52de;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.06);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#000;--card:#1c1c1e;--label:#f2f2f7;--label2:#98989f;--fill:rgba(120,120,128,.24);
    --sep:rgba(84,84,88,.55);--green-text:#30d158;--shadow:none}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--label);font:17px/1.35 var(--font);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;touch-action:manipulation}
body.noscroll{overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,p{margin:0}

/* ---------- Top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 78%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-bottom:.5px solid transparent}
.topbar-inner{max-width:1040px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.topbar h1{font:700 30px/1.1 var(--round);letter-spacing:-.4px}
.actions{display:flex;gap:10px}
.icon-btn{border:0;background:var(--fill);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--label)}
.icon-btn:active{transform:scale(.92)}
.pill-btn{border:0;background:var(--fill);height:44px;padding:0 16px;border-radius:22px;display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px}

main{max-width:1040px;margin:0 auto;padding:8px 24px 56px}
section+section{margin-top:34px}
h2{font:700 22px/1.2 var(--round);margin-bottom:14px;letter-spacing:-.2px}
.sub{color:var(--label2);font-size:15px;margin:-8px 0 14px}

/* ---------- Hero ---------- */
.hero{background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:30px 34px;
  display:grid;grid-template-columns:minmax(190px,250px) 1fr;gap:40px;align-items:center}
.phone-wrap{position:relative;display:grid;place-items:center;padding:6px 8px}
.phone-wrap::before{content:"";position:absolute;inset:12% 6%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(10,132,255,.35),rgba(175,82,222,.18) 60%,transparent);filter:blur(26px)}
#phone{position:relative;width:100%;max-width:230px;height:auto;overflow:visible;filter:drop-shadow(0 18px 26px rgba(0,0,0,.28))}
#phone.complete{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 18px 26px rgba(0,0,0,.28))}to{filter:drop-shadow(0 0 34px rgba(255,204,0,.9))}}
#liq{transition:transform 1.7s cubic-bezier(.22,.9,.25,1)}
.wave1{animation:slide 5.5s linear infinite}
.wave2{animation:slide 8s linear infinite reverse}
@keyframes slide{from{transform:translateX(0)}to{transform:translateX(-176px)}}

.stats{min-width:0}
.saved-label{color:var(--label2);font-weight:600;font-size:17px}
.money{font:800 clamp(56px,9vw,92px)/1 var(--round);letter-spacing:-2px;margin:2px 0 4px;
  background:linear-gradient(135deg,#30b0ff,#007aff 45%,#af52de);-webkit-background-clip:text;background-clip:text;color:transparent;
  font-variant-numeric:tabular-nums}
.togo{font:600 20px var(--round);color:var(--label)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip-stat{background:var(--fill);border-radius:16px;padding:10px 16px;min-width:116px}
.chip-stat b{display:block;font:700 22px var(--round);font-variant-numeric:tabular-nums}
.chip-stat span{font-size:14px;color:var(--label2)}
.miles{display:flex;align-items:flex-start;margin-top:26px}
.mile{flex:1;text-align:center;position:relative;font-size:13px;color:var(--label2);font-weight:600}
.mile::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:4px;background:var(--fill);border-radius:2px;z-index:0}
.mile:first-child::before{display:none}
.mile.hit::before{background:var(--green)}
.dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:var(--fill);
  display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800}
.mile.hit .dot{background:var(--green);animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
.mile.hit{color:var(--label)}
@keyframes pop{from{transform:scale(.4)}to{transform:scale(1)}}

/* ---------- Jobs ---------- */
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:16px}
.job{border:0;text-align:left;background:var(--card);border-radius:28px;padding:18px 18px 20px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;min-height:178px;transition:transform .16s cubic-bezier(.3,1.4,.5,1),opacity .3s;position:relative}
.job:active:not(:disabled){transform:scale(.95)}
.bubble{width:68px;height:68px;border-radius:22px;display:grid;place-items:center;font-size:38px;
  background:hsl(var(--h) 90% 55% / .17)}
.job .name{font:700 20px/1.2 var(--round);letter-spacing:-.2px}
.job .row{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.amt-pill{font:800 20px var(--round);color:var(--green-text);background:rgba(52,199,89,.16);padding:5px 14px;border-radius:999px}
.today{font-size:14px;color:var(--label2);font-weight:600}
.job:disabled{cursor:default;opacity:.62}
.job.done .amt-pill{background:var(--fill);color:var(--label2)}
.check{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800}

/* ---------- Lists ---------- */
.list{background:var(--card);border-radius:24px;box-shadow:var(--shadow);overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:13px 18px;min-height:64px}
.li+.li{border-top:.5px solid var(--sep)}
.li .em{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:24px;background:var(--fill);flex:none}
.li .txt{flex:1;min-width:0}
.li .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:14px;color:var(--label2)}
.li .v{font:700 18px var(--round);color:var(--green-text);font-variant-numeric:tabular-nums}
.li.void .t,.li.void .v{text-decoration:line-through;color:var(--label2)}
.empty{padding:26px 20px;text-align:center;color:var(--label2)}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.32);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,470px);max-height:92vh;overflow:auto;background:var(--card);border-radius:34px 34px 0 0;
  padding:30px 26px calc(26px + env(safe-area-inset-bottom));animation:rise .38s cubic-bezier(.2,.95,.3,1.08)}
.sheet.wide{width:min(100%,680px);height:min(92vh,780px)}
@keyframes rise{from{transform:translateY(60px);opacity:0}}
@media (min-width:700px){.backdrop{align-items:center}.sheet{border-radius:36px}}
.center{text-align:center}
.big-emoji{font-size:84px;line-height:1;margin-bottom:10px}
.sheet h3{margin:0 0 6px;font:800 28px/1.15 var(--round);letter-spacing:-.4px}
.sheet .lead{color:var(--label2);font-size:18px;margin-bottom:22px}
.stack{display:grid;gap:12px}
.btn{border:0;border-radius:999px;padding:17px 24px;font:700 19px var(--font);transition:transform .12s}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.6}
.btn.primary{background:var(--green);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn.plain{background:var(--fill);color:var(--label)}
.btn.danger{background:rgba(255,59,48,.14);color:var(--red)}
.btn.small{padding:9px 16px;font-size:15px}

/* ---------- Gate ---------- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(100%,400px);background:var(--card);border-radius:36px;box-shadow:var(--shadow);padding:36px 30px;text-align:center}
.gate-card .big-emoji{font-size:64px}
.gate-card h1{font:800 28px var(--round);margin-bottom:6px}
.gate-card p{color:var(--label2);margin-bottom:20px}
.gate-card code{background:var(--fill);padding:2px 6px;border-radius:6px;font-size:14px}

/* ---------- Forms ---------- */
.field{width:100%;font:17px var(--font);padding:15px 16px;border:0;border-radius:16px;background:var(--fill);color:var(--label);-webkit-appearance:none;appearance:none}
.field::placeholder{color:var(--label2)}
.field.pin{text-align:center;font-size:28px;letter-spacing:8px;font-weight:700}
.field.pin::placeholder{letter-spacing:0;font-size:17px;font-weight:400}
label.lbl{display:block;font-size:14px;font-weight:600;color:var(--label2);margin:0 4px 6px}
.err{color:var(--red);font-weight:600;min-height:22px;margin-top:10px;font-size:15px}
.seg{display:flex;background:var(--fill);border-radius:12px;padding:3px;margin:0 0 18px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18)}
.chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:0;background:var(--fill);border-radius:12px;width:44px;height:44px;font-size:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;justify-content:space-between;padding:6px 4px}
.switch input{-webkit-appearance:none;appearance:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s;flex:none}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.switch input:checked{background:var(--green)}
.switch input:checked::after{transform:translateX(20px)}
.admin-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.admin-head h3{margin:0}

/* ---------- Celebration ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
#cele{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:70;opacity:0}
#cele.show{animation:cele 2.8s ease both}
@keyframes cele{0%{opacity:0;transform:scale(.55)}10%{opacity:1;transform:scale(1.1)}18%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(-36px) scale(.98)}}
#cele .box{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  border-radius:40px;padding:26px 44px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#cele .amt{font:900 clamp(64px,14vw,120px)/1 var(--round);letter-spacing:-3px;color:var(--green-text)}
#cele .msg{font:800 28px var(--round);margin-top:4px}
#cele .sub2{color:var(--label2);font-size:18px;margin-top:2px}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:90;
  background:rgba(40,40,44,.94);color:#fff;padding:14px 22px;border-radius:999px;font-weight:600;max-width:90vw;text-align:center;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.2),opacity .3s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:700px){
  .hero{grid-template-columns:1fr;gap:16px;padding:24px 20px;text-align:center}
  .chips,.miles{justify-content:center}
  .topbar h1{font-size:24px}
  main{padding:4px 16px 48px}
  .topbar-inner{padding:12px 16px}
}
@media (prefers-reduced-motion: reduce){
  .wave1,.wave2,#phone.complete{animation:none}
  #liq{transition-duration:.01s}
}
</style>
</head>
<body>

<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="title">Charlie’s iPhone fund</h1>
      <div class="actions">
        <button id="soundBtn" class="icon-btn" aria-label="Sound on"></button>
        <button id="parentBtn" class="pill-btn" aria-label="Parent area"></button>
      </div>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="Progress">
      <div class="phone-wrap">
        <svg id="phone" viewBox="-6 -2 212 404" role="img" aria-label="An iPhone that fills up as money is saved">
          <defs>
            <linearGradient id="gFrame" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#e6e8ec"/><stop offset=".45" stop-color="#9a9ca5"/><stop offset="1" stop-color="#d4d6db"/>
            </linearGradient>
            <linearGradient id="gIdle" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#34343c"/><stop offset="1" stop-color="#17171c"/>
            </linearGradient>
            <linearGradient id="gLiquid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#5ac8fa"/><stop offset=".45" stop-color="#007aff"/><stop offset="1" stop-color="#af52de"/>
            </linearGradient>
            <linearGradient id="gShine" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".38" stop-color="#fff" stop-opacity=".04"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
            </linearGradient>
            <clipPath id="screenClip"><rect x="12" y="12" width="176" height="376" rx="30"/></clipPath>
          </defs>
          <rect x="-3" y="86" width="3" height="30" rx="1.5" fill="#8d8f98"/>
          <rect x="-3" y="130" width="3" height="52" rx="1.5" fill="#8d8f98"/>
          <rect x="-3" y="194" width="3" height="52" rx="1.5" fill="#8d8f98"/>
          <rect x="200" y="140" width="3" height="76" rx="1.5" fill="#8d8f98"/>
          <rect x="0" y="0" width="200" height="400" rx="44" fill="url(#gFrame)"/>
          <rect x="4" y="4" width="192" height="392" rx="40" fill="#0b0b0e"/>
          <g clip-path="url(#screenClip)">
            <rect x="12" y="12" width="176" height="376" fill="url(#gIdle)"/>
            <g id="liq" style="transform:translateY(388px)">
              <g transform="translate(12,0)">
                <g class="wave2"><path d="M0 8 Q22 0 44 8 T88 8 T132 8 T176 8 T220 8 T264 8 T308 8 T352 8 T396 8 T440 8 V440 H0 Z" fill="url(#gLiquid)" opacity=".5"/></g>
                <g class="wave1" transform="translate(0,5)"><path d="M0 8 Q22 0 44 8 T88 8 T132 8 T176 8 T220 8 T264 8 T308 8 T352 8 T396 8 T440 8 V440 H0 Z" fill="url(#gLiquid)"/></g>
              </g>
            </g>
            <rect x="12" y="12" width="176" height="376" fill="url(#gShine)"/>
            <text id="phonePct" x="100" y="206" text-anchor="middle" font-size="46" font-weight="800" fill="#fff"
              style="font-family:ui-rounded,-apple-system,Helvetica,sans-serif;paint-order:stroke" stroke="rgba(0,0,0,.25)" stroke-width="4">0%</text>
            <text id="phoneLbl" x="100" y="232" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" opacity=".9"
              style="font-family:-apple-system,Helvetica,sans-serif">saved</text>
          </g>
          <rect x="68" y="22" width="64" height="19" rx="9.5" fill="#000"/>
          <rect x="72" y="378" width="56" height="4" rx="2" fill="#fff" opacity=".75"/>
        </svg>
      </div>

      <div class="stats">
        <p class="saved-label" id="savedLabel">Saved so far</p>
        <p class="money" id="money" aria-live="polite">$0</p>
        <p class="togo" id="togo"></p>
        <div class="chips">
          <div class="chip-stat"><b id="weekAmt">$0</b><span>this week</span></div>
          <div class="chip-stat"><b id="jobCount">0</b><span>jobs done</span></div>
        </div>
        <div class="miles" id="miles" aria-label="Milestones"></div>
      </div>
    </section>

    <section>
      <h2>Jobs</h2>
      <p class="sub">Finished one? Tap it to add the money.</p>
      <div class="jobs" id="jobs"></div>
    </section>

    <section>
      <h2>Recent</h2>
      <div class="list" id="recent"></div>
    </section>
  </main>
</div>

<div id="sheetRoot"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="cele" aria-live="polite"><div class="box"><div class="amt"></div><div class="msg"></div><div class="sub2"></div></div></div>
<div id="toast" role="status"></div>

<script>
'use strict';

/* =====================================================================
   SETUP: paste the Web app URL from your Apps Script deployment here.
   ===================================================================== */
const CONFIG = {
  API_URL: 'https://script.google.com/macros/s/AKfycbx5ldifXgJppHIhWV0Ht-bl7fpuhQRY2rdvFqTAh77mbMae0TDaZHEUR07NtxkjFOvBdw/exec'
};

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
function h(tag, props, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const money = (n, exact = true) => {
  const v = exact ? n : Math.round(n);
  return '$' + (Number.isInteger(v) ? v.toLocaleString('en-AU') : v.toFixed(2));
};
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const hue = id => { let x = 0; for (const c of String(id)) x = (x * 31 + c.charCodeAt(0)) % 360; return x; };

const tf = new Intl.DateTimeFormat('en-AU', { hour: 'numeric', minute: '2-digit' });
const df = new Intl.DateTimeFormat('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
function when(ms){
  const d = new Date(ms), now = new Date(), y = new Date(now);
  y.setDate(now.getDate() - 1);
  if (d.toDateString() === now.toDateString()) return 'Today, ' + tf.format(d);
  if (d.toDateString() === y.toDateString()) return 'Yesterday, ' + tf.format(d);
  return df.format(d) + ', ' + tf.format(d);
}

const ICON = {
  lock: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  on: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>',
  off: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>'
};

/* ---------- state ---------- */
const S = { pin: ls.get('cj_pin'), parentPin: null, state: null, lastFetch: 0, shownTotal: null, shownPct: 0 };
let muted = ls.get('cj_mute') === '1';

/* ---------- API ---------- */
class ApiError extends Error { constructor(code, state){ super(code); this.code = code; this.state = state; } }
async function api(action, payload = {}, pin = S.pin){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  let res;
  try {
    // No custom headers => a "simple" request, so the browser skips CORS preflight (Apps Script can't answer one).
    res = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ action, pin, ...payload }), redirect: 'follow', signal: ctrl.signal, credentials: 'omit' });
  } catch { throw new ApiError('network'); }
  finally { clearTimeout(timer); }
  let data;
  try { data = await res.json(); } catch { throw new ApiError('bad_response'); }
  if (!data.ok) throw new ApiError(data.error || 'server_error', data.state);
  return data;
}
const ERR = {
  network: 'Can’t reach the sheet. Check the Wi-Fi and try again.',
  bad_response: 'Something went wrong talking to the sheet. Try again.',
  bad_pin: 'That PIN isn’t right.',
  locked: 'Too many wrong PINs. Try again in 10 minutes.',
  not_setup: 'The backend isn’t set up yet. Run setup() in Apps Script.',
  duplicate: 'You just did that one — nice! Give it a moment.',
  daily_limit: 'That one’s already done today. Come back tomorrow!',
  unknown_job: 'That job isn’t available any more.',
  busy: 'The sheet is busy. Try again in a few seconds.',
  forbidden: 'Parents only.',
  bad_job: 'Check the job name and amount.',
  bad_settings: 'Check the goal amount.',
  server_error: 'Something went wrong. Try again.'
};
const errText = e => ERR[e && e.code] || ERR.server_error;

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

/* ---------- sound ---------- */
let actx;
function unlockAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch {}
}
function chime(big){
  if (muted || !actx) return;
  try {
    const notes = big ? [523, 659, 784, 1047, 1319, 1568] : [523, 659, 784, 1047];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.09;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.16, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + 0.6);
    });
  } catch {}
}
function renderSoundBtn(){
  const b = $('#soundBtn');
  b.innerHTML = muted ? ICON.off : ICON.on;
  b.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on');
}

/* ---------- confetti ---------- */
const fx = (() => {
  const c = $('#fx'), ctx = c.getContext && c.getContext('2d');
  let w = 0, hh = 0, parts = [], raf = 0, rain = 0;
  const colors = ['#ff3b30', '#ff9500', '#ffcc00', '#34c759', '#5ac8fa', '#007aff', '#af52de', '#ff2d55'];
  const emojis = ['💵', '💰', '⭐', '✨', '🎉'];
  function resize(){
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    w = innerWidth; hh = innerHeight;
    c.width = w * dpr; c.height = hh * dpr; c.style.width = w + 'px'; c.style.height = hh + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();
  function add(x, y, a, speed, kind){
    parts.push({ x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      size: 6 + Math.random() * 8, color: colors[(Math.random() * colors.length) | 0], kind,
      emoji: emojis[(Math.random() * emojis.length) | 0], age: 0, ttl: 140 + Math.random() * 90 });
  }
  function cannon(x, y, spread, dir, n, power){
    for (let i = 0; i < n; i++) {
      const r = Math.random();
      add(x, y, dir + (Math.random() - .5) * spread, power * (.45 + Math.random() * .75), r < .16 ? 'emoji' : r < .6 ? 'rect' : 'circle');
    }
  }
  function loop(){
    ctx.clearRect(0, 0, w, hh);
    if (rain > 0) { rain--; for (let i = 0; i < 2; i++) add(Math.random() * w, -20, Math.PI / 2 + (Math.random() - .5) * .4, 2 + Math.random() * 3, Math.random() < .5 ? 'emoji' : 'rect'); }
    parts = parts.filter(p => p.age < p.ttl && p.y < hh + 60);
    for (const p of parts) {
      p.vy += .28; p.vx *= .992; p.vy *= .992; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.age++;
      ctx.save(); ctx.globalAlpha = Math.max(0, p.age > p.ttl - 30 ? (p.ttl - p.age) / 30 : 1);
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      if (p.kind === 'emoji') { ctx.font = (p.size * 2.2) + 'px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(p.emoji, 0, 0); }
      else { ctx.fillStyle = p.color; if (p.kind === 'rect') ctx.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * .6); else { ctx.beginPath(); ctx.arc(0, 0, p.size / 3, 0, 6.28); ctx.fill(); } }
      ctx.restore();
    }
    if (parts.length || rain > 0) raf = requestAnimationFrame(loop); else { raf = 0; ctx.clearRect(0, 0, w, hh); }
  }
  const start = () => { if (ctx && !raf) raf = requestAnimationFrame(loop); };
  return {
    celebrate(x, y, big){
      if (!ctx) return;
      const k = reduced() ? .25 : 1;
      cannon(x, y, 1.7, -Math.PI / 2, Math.round(90 * k), big ? 19 : 15);
      setTimeout(() => { cannon(0, hh, 1.0, -Math.PI / 3, Math.round(60 * k), big ? 25 : 20); cannon(w, hh, 1.0, -2 * Math.PI / 3, Math.round(60 * k), big ? 25 : 20); start(); }, 180);
      if (big) [700, 1300, 1900].forEach(ms => setTimeout(() => { cannon(Math.random() * w, hh * .75, 1.4, -Math.PI / 2, Math.round(70 * k), 20); start(); }, ms));
      if (!reduced()) rain = big ? 300 : 70;
      start();
    }
  };
})();

function showBadge(amount, msg, sub){
  const el = $('#cele');
  $('.amt', el).textContent = '+' + money(amount);
  $('.msg', el).textContent = msg;
  $('.sub2', el).textContent = sub || '';
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}

/* ---------- number animation ---------- */
const tokens = new WeakMap();
function animateNumber(el, from, to, fmt, dur = 1500){
  const token = {}; tokens.set(el, token);
  if (from === to || reduced()) { el.textContent = fmt(to, true); return; }
  const t0 = performance.now();
  (function frame(now){
    if (tokens.get(el) !== token) return;
    const p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = p < 1 ? fmt(from + (to - from) * e, false) : fmt(to, true);
    if (p < 1) requestAnimationFrame(frame);
  })(t0);
}

/* ---------- rendering ---------- */
const goalOf = () => S.state.settings.goalAmount;
function renderHero(){
  const st = S.state, goal = goalOf(), total = st.total, p = Math.min(1, total / goal);
  $('#title').textContent = `${st.settings.childName}’s ${st.settings.goalName} fund`;
  $('#savedLabel').textContent = `Saved for the ${st.settings.goalName}`;
  const from = S.shownTotal == null ? 0 : S.shownTotal;
  animateNumber($('#money'), from, total, money);
  animateNumber($('#phonePct'), S.shownPct, p * 100, v => (v > 0 && v < 10 ? (Math.round(v * 10) / 10) : Math.floor(v + 1e-9)) + '%');
  S.shownTotal = total; S.shownPct = p * 100;

  const left = Math.max(0, goal - total);
  $('#togo').textContent = left > 0 ? `${money(left)} to go` : `Goal reached! 🎉`;
  $('#weekAmt').textContent = money(st.weekTotal);
  $('#jobCount').textContent = st.count.toLocaleString('en-AU');
  $('#phone').classList.toggle('complete', total >= goal);

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const shown = total > 0 ? Math.max(p, .02) : 0; // always show a little water once he's earned something
    $('#liq').style.transform = `translateY(${388 - 392 * shown}px)`;
  }));

  const miles = $('#miles'); miles.replaceChildren();
  [1, 2, 3, 4].forEach(i => {
    const amt = goal * i / 4, hit = total >= amt;
    miles.append(h('div', { class: 'mile' + (hit ? ' hit' : '') },
      h('div', { class: 'dot' }, hit ? '✓' : ''), money(Math.round(amt * 100) / 100)));
  });
}

function activeJobs(){ return S.state.jobs.filter(j => j.active); }
function renderJobs(){
  const box = $('#jobs'); box.replaceChildren();
  const jobs = activeJobs();
  if (!jobs.length) { box.append(h('div', { class: 'list', style: 'grid-column:1/-1' }, h('div', { class: 'empty' }, 'No jobs yet. A parent can add some from the Parents button.'))); return; }
  jobs.forEach(j => {
    const n = S.state.todayCounts[j.id] || 0, done = n >= j.maxPerDay;
    const label = done ? 'Done today' : (j.maxPerDay > 1 ? `${n} of ${j.maxPerDay} today` : '');
    const b = h('button', { class: 'job' + (done ? ' done' : ''), style: `--h:${hue(j.id)}`, disabled: done,
      'aria-label': `${j.name}, ${money(j.value)}${done ? ', done today' : ''}`, onClick: () => openConfirm(j) },
      h('div', { class: 'bubble' }, j.emoji),
      h('div', { class: 'name' }, j.name),
      h('div', { class: 'row' }, h('span', { class: 'amt-pill' }, '+' + money(j.value)), h('span', { class: 'today' }, label)),
      done ? h('div', { class: 'check', 'aria-hidden': 'true' }, '✓') : null);
    box.append(b);
  });
}
function renderRecent(){
  const box = $('#recent'); box.replaceChildren();
  const rows = S.state.recent.filter(r => r.status === 'ok').slice(0, 8);
  if (!rows.length) { box.append(h('div', { class: 'empty' }, 'Nothing yet. Do a job, then tap it to get started!')); return; }
  rows.forEach(r => box.append(h('div', { class: 'li' },
    h('div', { class: 'em' }, r.emoji || '⭐'),
    h('div', { class: 'txt' }, h('div', { class: 't' }, r.job), h('div', { class: 's' }, when(r.ts))),
    h('div', { class: 'v' }, '+' + money(r.value)))));
}
function renderAll(){ renderHero(); renderJobs(); renderRecent(); }

/* ---------- sheets ---------- */
let sheet = null;
function openSheet(build, opts = {}){
  closeSheet();
  const body = h('div', { class: 'sheet ' + (opts.cls || ''), role: 'dialog', 'aria-modal': 'true' });
  const bd = h('div', { class: 'backdrop', onClick: e => { if (e.target === bd && !opts.sticky) closeSheet(); } }, body);
  $('#sheetRoot').append(bd);
  sheet = { bd, body, onClose: opts.onClose };
  document.body.classList.add('noscroll');
  build(body);
  return body;
}
function closeSheet(){
  if (!sheet) return;
  const { bd, onClose } = sheet; sheet = null;
  bd.remove(); document.body.classList.remove('noscroll');
  if (onClose) onClose();
}
addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ---------- complete a job ---------- */
function openConfirm(job){
  openSheet(body => {
    const yes = h('button', { class: 'btn primary', onClick: async () => {
      if (yes.disabled) return;
      unlockAudio();
      yes.disabled = true; yes.textContent = 'Saving…';
      const r0 = yes.getBoundingClientRect(), x = r0.left + r0.width / 2, y = r0.top;
      const prev = S.state.total;
      try {
        const r = await api('complete', { jobId: job.id });
        closeSheet();
        S.state = r.state; S.lastFetch = Date.now();
        window.scrollTo({ top: 0, behavior: reduced() ? 'auto' : 'smooth' });
        renderAll();
        celebrate(prev, r.state.total, r.result.value, x, y);
      } catch (e) {
        if (e.state) { S.state = e.state; renderAll(); }
        closeSheet(); toast(errText(e));
      }
    } }, 'Yes, I did it!');
    body.append(
      h('div', { class: 'center' },
        h('div', { class: 'big-emoji' }, job.emoji),
        h('h3', {}, `Did you finish “${job.name}”?`),
        h('p', { class: 'lead' }, `${money(job.value)} goes into your ${S.state.settings.goalName} fund.`)),
      h('div', { class: 'stack' }, yes, h('button', { class: 'btn plain', onClick: closeSheet }, 'Not yet')));
  });
}

const CHEERS = ['Nice work!', 'Cha-ching!', 'Legend!', 'Money in the bank!', 'Crushed it!', 'Another one down!', 'Boom!'];
const MILES = { 25: 'A quarter of the way there!', 50: 'Halfway to your iPhone!', 75: 'Three quarters done. So close!', 100: 'You did it!' };
function celebrate(prevTotal, newTotal, amount, x, y){
  const goal = goalOf();
  const before = prevTotal / goal * 100, after = newTotal / goal * 100;
  const hit = [25, 50, 75, 100].filter(m => before < m && after >= m).pop();
  const big = !!hit;
  fx.celebrate(x, y, big); chime(big);
  const left = Math.max(0, goal - newTotal);
  showBadge(amount, hit ? MILES[hit] : CHEERS[(Math.random() * CHEERS.length) | 0], hit === 100 ? '' : `${money(left)} to go`);
  if (hit === 100) setTimeout(openGoalSheet, 2600);
}
function openGoalSheet(){
  const st = S.state.settings;
  openSheet(body => body.append(
    h('div', { class: 'center' },
      h('div', { class: 'big-emoji' }, '📱'),
      h('h3', {}, `${st.childName}, you did it!`),
      h('p', { class: 'lead' }, `You earned ${money(st.goalAmount)} for your ${st.goalName}. Go show a parent!`)),
    h('div', { class: 'stack' }, h('button', { class: 'btn blue', onClick: closeSheet }, 'Awesome!'))), { sticky: true });
}

/* ---------- gate (PIN / setup / retry) ---------- */
function showGate(opts = {}){
  $('#app').hidden = true;
  const g = $('#gate'); g.hidden = false; g.replaceChildren();
  if (opts.setup) {
    g.append(h('div', { class: 'gate-card' }, h('div', { class: 'big-emoji' }, '🛠️'), h('h1', {}, 'Almost ready'),
      h('p', {}, 'Open ', h('code', {}, 'index.html'), ' and paste your Apps Script Web app URL into ', h('code', {}, 'API_URL'), '.')));
    return;
  }
  if (opts.retry) {
    g.append(h('div', { class: 'gate-card' }, h('div', { class: 'big-emoji' }, '📡'), h('h1', {}, 'No connection'),
      h('p', {}, opts.msg || ERR.network), h('button', { class: 'btn blue', style: 'width:100%', onClick: () => boot() }, 'Try again')));
    return;
  }
  const input = h('input', { class: 'field pin', type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: '12', placeholder: 'Enter PIN', 'aria-label': 'PIN' });
  const err = h('p', { class: 'err', role: 'alert' }, typeof opts === 'string' ? opts : (opts.msg || ''));
  const go = h('button', { class: 'btn blue', style: 'width:100%;margin-top:16px', onClick: submit }, 'Unlock');
  async function submit(){
    const pin = input.value.trim();
    if (!/^\d{6,12}$/.test(pin)) { err.textContent = 'Enter your 6 to 12 digit PIN.'; return; }
    go.disabled = true; go.textContent = 'Checking…'; err.textContent = '';
    try { await api('state', {}, pin); S.pin = pin; ls.set('cj_pin', pin); await boot(); }
    catch (e) { err.textContent = errText(e); go.disabled = false; go.textContent = 'Unlock'; input.select(); }
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  g.append(h('div', { class: 'gate-card' }, h('div', { class: 'big-emoji' }, '📱'), h('h1', {}, 'Charliejobs'),
    h('p', {}, 'Enter the PIN to see your progress.'), input, err, go));
  setTimeout(() => input.focus(), 50);
}

/* ---------- parent area ---------- */
const EMOJIS = ['🗑️', '🍽️', '🐕', '🧺', '🚗', '🌿', '🧹', '🛏️', '🪟', '🐈', '🧽', '🚿', '🥗', '📦', '🪴', '👟', '🛒', '⭐'];
const A = { tab: 'Jobs', editing: undefined, err: '', busy: false };

function openParent(){
  if (S.parentPin) return openAdmin();
  const input = h('input', { class: 'field pin', type: 'password', inputmode: 'numeric', autocomplete: 'off', maxlength: '12', placeholder: 'Parent PIN', 'aria-label': 'Parent PIN' });
  const err = h('p', { class: 'err', role: 'alert' });
  const go = h('button', { class: 'btn blue', onClick: submit }, 'Continue');
  async function submit(){
    const pin = input.value.trim();
    if (!/^\d{6,12}$/.test(pin)) { err.textContent = 'Enter your 6 to 12 digit PIN.'; return; }
    go.disabled = true; go.textContent = 'Checking…'; err.textContent = '';
    try {
      const r = await api('state', {}, pin);
      if (r.role !== 'parent') { err.textContent = 'That isn’t the parent PIN.'; go.disabled = false; go.textContent = 'Continue'; return; }
      S.parentPin = pin; S.state = r.state; openAdmin();
    } catch (e) {
      if (e.code === 'locked') { closeSheet(); toast(errText(e)); return; }
      err.textContent = errText(e); go.disabled = false; go.textContent = 'Continue';
    }
  }
  input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  openSheet(body => {
    body.append(h('div', { class: 'center' }, h('div', { class: 'big-emoji' }, '🔒'), h('h3', {}, 'Parents only'), h('p', { class: 'lead' }, 'Enter the parent PIN to manage jobs.')),
      input, err, h('div', { class: 'stack', style: 'margin-top:14px' }, go, h('button', { class: 'btn plain', onClick: closeSheet }, 'Cancel')));
    setTimeout(() => input.focus(), 60);
  });
}

function openAdmin(){
  A.tab = 'Jobs'; A.editing = undefined; A.err = '';
  openSheet(() => renderAdmin(), { cls: 'wide', sticky: true, onClose: () => { S.parentPin = null; renderAll(); } });
}

async function adminCall(action, payload, okMsg){
  A.busy = true; A.err = '';
  try {
    const r = await api(action, payload, S.parentPin);
    S.state = r.state; renderAll();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    if (e.code === 'bad_pin' || e.code === 'locked') { closeSheet(); toast(errText(e)); return false; }
    A.err = errText(e); return false;
  } finally { A.busy = false; if (sheet) renderAdmin(); }
}

function renderAdmin(){
  const body = sheet.body;
  const tabs = h('div', { class: 'seg', role: 'group' }, ['Jobs', 'History', 'Goal'].map(t =>
    h('button', { 'aria-pressed': String(A.tab === t), onClick: () => { A.tab = t; A.editing = undefined; A.err = ''; renderAdmin(); } }, t)));
  body.replaceChildren(
    h('div', { class: 'admin-head' }, h('h3', {}, 'Parent area'), h('button', { class: 'btn plain small', onClick: closeSheet }, 'Done')),
    tabs,
    A.tab === 'Jobs' ? adminJobs() : A.tab === 'History' ? adminHistory() : adminGoal(),
    h('p', { class: 'err', role: 'alert' }, A.err));
}

function adminJobs(){
  if (A.editing !== undefined) return jobForm(A.editing);
  const jobs = S.state.jobs;
  return h('div', {},
    h('div', { class: 'list' }, jobs.length ? jobs.map(j => h('button', { class: 'li' + (j.active ? '' : ' void'), style: 'width:100%;border:0;background:none;text-align:left;color:inherit', onClick: () => { A.editing = j; renderAdmin(); } },
      h('div', { class: 'em' }, j.emoji),
      h('div', { class: 'txt' }, h('div', { class: 't' }, j.name), h('div', { class: 's' }, (j.active ? 'Up to ' : 'Hidden · up to ') + j.maxPerDay + ' per day')),
      h('div', { class: 'v' }, money(j.value)))) : h('div', { class: 'empty' }, 'No jobs yet.')),
    h('div', { class: 'stack', style: 'margin-top:18px' }, h('button', { class: 'btn blue', onClick: () => { A.editing = null; renderAdmin(); } }, 'Add a job')));
}

function jobForm(job){
  const emoji = h('input', { class: 'field', value: job ? job.emoji : '⭐', maxlength: '8', 'aria-label': 'Emoji', style: 'font-size:28px;text-align:center;width:90px' });
  const name = h('input', { class: 'field', value: job ? job.name : '', maxlength: '40', placeholder: 'e.g. Water the plants', 'aria-label': 'Job name' });
  const value = h('input', { class: 'field', type: 'number', inputmode: 'decimal', step: '0.5', min: '0', max: '1000', value: job ? String(job.value) : '', placeholder: '5', 'aria-label': 'Amount in dollars' });
  const max = h('select', { class: 'field', 'aria-label': 'Max times per day' }, [1, 2, 3, 4, 5].map(n => h('option', { value: String(n), selected: (job ? job.maxPerDay : 1) === n }, n === 1 ? 'Once a day' : n + ' times a day')));
  const active = h('input', { type: 'checkbox', checked: job ? job.active : true, 'aria-label': 'Show this job' });
  if (job ? job.active : true) active.checked = true;
  const chips = h('div', { class: 'chips-row' }, EMOJIS.map(e => h('button', { type: 'button', class: 'chip', onClick: () => { emoji.value = e; } }, e)));
  const save = h('button', { class: 'btn blue', onClick: async () => {
    const v = parseFloat(value.value);
    if (!name.value.trim() || !(v >= 0)) { A.err = ERR.bad_job; renderAdmin(); return; }
    const ok = await adminCall('saveJob', { job: { id: job ? job.id : undefined, emoji: emoji.value, name: name.value, value: v, maxPerDay: Number(max.value), active: active.checked } }, 'Saved');
    if (ok) { A.editing = undefined; renderAdmin(); }
  } }, 'Save job');
  return h('div', { class: 'stack' },
    h('div', { style: 'display:flex;gap:12px;align-items:flex-end' },
      h('div', {}, h('label', { class: 'lbl' }, 'Emoji'), emoji),
      h('div', { style: 'flex:1' }, h('label', { class: 'lbl' }, 'Job'), name)),
    chips,
    h('div', { class: 'two' }, h('div', {}, h('label', { class: 'lbl' }, 'Amount ($)'), value), h('div', {}, h('label', { class: 'lbl' }, 'How often'), max)),
    h('label', { class: 'switch' }, h('span', {}, 'Show this job'), active),
    save,
    h('button', { class: 'btn plain', onClick: () => { A.editing = undefined; A.err = ''; renderAdmin(); } }, 'Cancel'));
}

function adminHistory(){
  const rows = S.state.recent;
  if (!rows.length) return h('div', { class: 'list' }, h('div', { class: 'empty' }, 'Nothing logged yet.'));
  return h('div', {}, h('p', { class: 'sub', style: 'margin-top:-4px' }, 'Void an entry if a job was tapped by mistake. It comes off the total.'),
    h('div', { class: 'list' }, rows.map(r => h('div', { class: 'li' + (r.status === 'void' ? ' void' : '') },
      h('div', { class: 'em' }, r.emoji || '⭐'),
      h('div', { class: 'txt' }, h('div', { class: 't' }, r.job), h('div', { class: 's' }, when(r.ts) + (r.status === 'void' ? ' · voided' : ''))),
      h('div', { class: 'v', style: 'margin-right:6px' }, money(r.value)),
      h('button', { class: 'btn small ' + (r.status === 'void' ? 'plain' : 'danger'), disabled: A.busy,
        onClick: () => adminCall('setEntryStatus', { id: r.id, status: r.status === 'void' ? 'ok' : 'void' }, r.status === 'void' ? 'Restored' : 'Voided') },
        r.status === 'void' ? 'Restore' : 'Void')))));
}

function adminGoal(){
  const s = S.state.settings;
  const child = h('input', { class: 'field', value: s.childName, maxlength: '30', 'aria-label': 'Name' });
  const goal = h('input', { class: 'field', value: s.goalName, maxlength: '30', 'aria-label': 'Goal name' });
  const amt = h('input', { class: 'field', type: 'number', inputmode: 'decimal', min: '1', max: '100000', value: String(s.goalAmount), 'aria-label': 'Goal amount' });
  return h('div', { class: 'stack' },
    h('div', {}, h('label', { class: 'lbl' }, 'Name'), child),
    h('div', { class: 'two' }, h('div', {}, h('label', { class: 'lbl' }, 'Saving for'), goal), h('div', {}, h('label', { class: 'lbl' }, 'Goal amount ($)'), amt)),
    h('button', { class: 'btn blue', onClick: () => adminCall('saveSettings', { settings: { childName: child.value, goalName: goal.value, goalAmount: parseFloat(amt.value) } }, 'Saved') }, 'Save goal'),
    h('hr', { style: 'border:0;border-top:.5px solid var(--sep);width:100%;margin:10px 0' }),
    h('button', { class: 'btn danger', onClick: () => { if (confirm('Forget the PIN on this iPad? It will ask for it again.')) { ls.del('cj_pin'); ls.del('cj_state'); location.reload(); } } }, 'Lock this iPad'));
}

/* ---------- boot ---------- */
function showApp(){ $('#gate').hidden = true; $('#app').hidden = false; }
async function refresh(initial){
  try {
    const r = await api('state');
    S.state = r.state; S.lastFetch = Date.now();
    ls.set('cj_state', JSON.stringify(r.state));
    showApp(); renderAll();
  } catch (e) {
    if (e.code === 'bad_pin') { ls.del('cj_pin'); ls.del('cj_state'); S.pin = null; return showGate('The PIN has changed. Enter the new one.'); }
    if (e.code === 'locked' || e.code === 'not_setup') return showGate({ retry: true, msg: errText(e) });
    if (!S.state) return showGate({ retry: true, msg: errText(e) });
    if (!initial) toast(errText(e));
  }
}
async function boot(){
  if (CONFIG.API_URL.includes('PASTE_')) return showGate({ setup: true });
  if (!S.pin) return showGate();
  if (!S.state) {
    const cached = ls.get('cj_state');
    if (cached) { try { S.state = JSON.parse(cached); showApp(); renderAll(); } catch { S.state = null; } }
  }
  await refresh(true);
}

$('#soundBtn').addEventListener('click', () => { muted = !muted; ls.set('cj_mute', muted ? '1' : '0'); renderSoundBtn(); unlockAudio(); chime(false); });
$('#parentBtn').innerHTML = ICON.lock + '<span>Parents</span>';
$('#parentBtn').addEventListener('click', openParent);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.pin && S.state && !sheet && Date.now() - S.lastFetch > 15000) refresh(false);
});
renderSoundBtn();
boot();
</script>
</body>
